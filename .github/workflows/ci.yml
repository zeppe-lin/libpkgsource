name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC shared
            cc: gcc
            cxx: g++
            mode: shared
            man_pages: enabled
            html_docs: enabled
          - name: GCC static
            cc: gcc
            cxx: g++
            mode: static
            man_pages: disabled
            html_docs: disabled
          - name: Clang shared
            cc: clang
            cxx: clang++
            mode: shared
            man_pages: disabled
            html_docs: disabled
          - name: Clang static
            cc: clang
            cxx: clang++
            mode: static
            man_pages: disabled
            html_docs: disabled
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - name: Check out libpkgsource
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils \
            clang \
            clang-format-17 \
            doxygen \
            libssl-dev \
            mandoc \
            ninja-build \
            pandoc \
            pkg-config \
            python3-venv
          python3 -m venv "$RUNNER_TEMP/meson-venv"
          "$RUNNER_TEMP/meson-venv/bin/pip" install 'meson==1.10.2'
          echo "$RUNNER_TEMP/meson-venv/bin" >> "$GITHUB_PATH"

      - name: Configure, build, and test
        run: |
          prefix="$RUNNER_TEMP/prefix"
          meson setup build \
            --prefix="$prefix" \
            --libdir=lib \
            -Ddefault_library=${{ matrix.mode }} \
            -Dlink_mode=${{ matrix.mode }} \
            -Dtests=enabled \
            -Dman_pages=${{ matrix.man_pages }} \
            -Dhtml_docs=${{ matrix.html_docs }} \
            -Dsha256_provider=openssl \
            -Dwerror=true
          meson compile -C build
          meson test -C build --print-errorlogs
          echo "PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$prefix/lib" >> "$GITHUB_ENV"

      - name: Qualify public API documentation
        if: matrix.name == 'GCC shared'
        run: doxygen Doxyfile

      - name: Qualify manuals
        if: matrix.man_pages == 'enabled'
        run: find build/docs/man -type f -name '*.3' -exec mandoc -Tlint {} +

      - name: Qualify staged documentation install
        if: matrix.name == 'GCC shared'
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/stage"
          rm -rf "$stage"
          meson install -C build --destdir "$stage"
          tests/contracts/check_installed_docs.sh "$stage$PREFIX"
          tests/contracts/check_installed_html_docs.sh "$stage$PREFIX" 3.0.1

      - name: Install libraries and metadata
        run: meson install -C build

      - name: Qualify installed consumers
        shell: bash
        run: |
          set -euo pipefail
          flags=()
          if [[ '${{ matrix.mode }}' == static ]]; then
            flags+=(--static)
          fi

          "$CXX" -std=c++17 -Wall -Wextra -Wpedantic -Werror \
            tests/installed/core_consumer.cpp \
            $(pkg-config "${flags[@]}" --cflags --libs libpkgsource) \
            -o core-consumer

          "$CXX" -std=c++17 -Wall -Wextra -Wpedantic -Werror \
            tests/installed/codec_consumer.cpp \
            $(pkg-config "${flags[@]}" --cflags --libs libpkgsource-codec) \
            -o codec-consumer

          ./core-consumer
          ./codec-consumer
          test "$(pkg-config --modversion libpkgsource)" = 3.0.1
          test "$(pkg-config --modversion libpkgsource-codec)" = 3.0.1

      - name: Audit shared-library closure
        if: matrix.mode == 'shared'
        shell: bash
        run: |
          set -euo pipefail
          core=$(find build -type f -name 'libpkgsource.so.*' ! -type l -print -quit)
          codec=$(find build -type f -name 'libpkgsource-codec.so.*' ! -type l -print -quit)

          readelf -d "$core" | tee core.dynamic
          readelf -d "$codec" | tee codec.dynamic

          grep -F 'Library soname: [libpkgsource.so.3]' core.dynamic
          grep -F 'Library soname: [libpkgsource-codec.so.1]' codec.dynamic
          grep -E 'Shared library: \[libcrypto\.so' core.dynamic
          grep -F 'Shared library: [libpkgsource.so.3]' codec.dynamic
          grep -E 'Shared library: \[libcrypto\.so' codec.dynamic

          ! grep -E 'libyaml|libpkgplan|libpkgsource-codec' core.dynamic
          ! grep -E 'libyaml|libpkgplan' codec.dynamic

  sanitizers:
    name: ${{ matrix.name }} sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            cc: gcc
            cxx: g++
          - name: Clang
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      ASAN_OPTIONS: halt_on_error=1:abort_on_error=1:detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1:abort_on_error=1:print_stacktrace=1
    steps:
      - name: Check out libpkgsource
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang \
            libssl-dev \
            ninja-build \
            pkg-config \
            python3-venv
          python3 -m venv "$RUNNER_TEMP/meson-venv"
          "$RUNNER_TEMP/meson-venv/bin/pip" install 'meson==1.10.2'
          echo "$RUNNER_TEMP/meson-venv/bin" >> "$GITHUB_PATH"

      - name: Configure, build, and test
        run: |
          meson setup build \
            -Ddefault_library=static \
            -Dlink_mode=static \
            -Dtests=enabled \
            -Dman_pages=disabled \
            -Dhtml_docs=disabled \
            -Dsha256_provider=openssl \
            -Db_sanitize=address,undefined \
            -Db_lundef=false \
            -Dwerror=true
          meson compile -C build
          meson test -C build --print-errorlogs
